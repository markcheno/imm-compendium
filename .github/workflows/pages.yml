# Publishes the static site in web/ to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # A new VERSION makes installed copies fetch the new files and offer a reload.
      - name: Stamp the service worker with this commit
        run: |
          sed -i "s/^const VERSION = \"dev\";/const VERSION = \"${GITHUB_SHA::7}\";/" web/sw.js
          grep -q "^const VERSION = \"${GITHUB_SHA::7}\";" web/sw.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
